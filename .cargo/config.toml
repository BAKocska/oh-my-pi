# Embedded Python: omp-demo statically links the vendored python-build-standalone
# CPython (see crates/py/scripts/fetch-python.sh). The config file tells pyo3 to link
# libpython statically instead of introspecting an installed interpreter.
#
# On macOS, dev builds use vendor/python (freethreaded+debug, fast native link);
# release builds override PYO3_CONFIG_FILE=vendor/python-release/pyo3-config.txt
# (freethreaded+pgo+lto, linked with Homebrew lld via crates/py/scripts/ld64.lld).

[env]
PYO3_CONFIG_FILE = { value = "vendor/python/pyo3-config.txt", relative = true }

# Dev links go through ld64.lld as well: the 652 MB statically-linked CPython
# images overflow ld64's compact-unwind fast path (__eh_frame > 16 MB), and
# lld links them several times faster. Same shim the release tree uses.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=--ld-path=/opt/homebrew/bin/ld64.lld"]
# Store each crate's metadata only in its .rmeta instead of duplicating it into
# every rlib. Measured on a reqwest-sized graph: 196 MB -> 130 MB target dir at
# identical build times. Requires the pinned nightly (rust-toolchain.toml).
# The accepted spelling is toolchain-coupled: cargo took `"DoNotEmbed"` before
# ~2026-08 and a bare boolean after. This matches nightly-2026-08-08; if you
# bump rust-toolchain.toml backwards, switch to `"DoNotEmbed"`.
[unstable]
embed-metadata = false
