id = "examples.gateway-litellm"
entry = "gateway_litellm"
version = "0.1.0"
description = "OpenAI-compatible LiteLLM gateway with model-info discovery and catalog pricing."
requires = []
capabilities = ["env.net"]

[[hooks]]
event = "models_discover"
phase = "transform"
order = 0
failure = "fail-open"

[[declarations]]
id = "litellm"
kind = "provider"
module = "gateway_litellm"
key = "litellm@0"
trigger = "lazy"
api = 1
failure = "fault"

[settings.base_url]
type = "string"
default = "http://127.0.0.1:4000/v1"
description = "OpenAI-compatible LiteLLM gateway base URL."
