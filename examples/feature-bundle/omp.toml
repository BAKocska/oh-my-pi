id = "examples.feature-bundle"
entry = "feature_bundle"
kind = "extension"
version = "0.1.0"
description = "Three independently selectable features hosted as one extension bundle."
requires = []
capabilities = ["journal.append", "ui.slots"]

[features.greet]
entry = "feature_bundle.greet"
default = true
description = "A tiny greeting device."
requires = []

[features.stamp]
entry = "feature_bundle.stamp"
default = true
description = "A turn observer that appends a typed journal stamp."
requires = []

[features.badge]
entry = "feature_bundle.badge"
default = true
description = "A retained statusline badge."
requires = []

[[tools]]
name = "bundle_greet"
kind = "soft"
family = "v"
rev = 1
module = "feature_bundle.greet"
summary = "Return a short greeting for one name."

[[hooks]]
event = "turn_end"
phase = "observe"
module = "feature_bundle.stamp"
failure = "fail-open"

[[hooks]]
event = "extension_activate"
phase = "observe"
module = "feature_bundle.badge"
failure = "fail-open"
