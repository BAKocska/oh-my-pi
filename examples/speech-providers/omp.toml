id = "examples.speech-providers"
entry = "speech_providers"
version = "0.1.0"
description = "Speech synthesis and transcription through declared provider routes."
requires = []
capabilities = ["provider"]

[[tools]]
name = "speak"
kind = "soft"
family = "speech"
rev = 1
module = "speech_providers"
summary = "Synthesize text into media-typed audio."

[[tools]]
name = "transcribe"
kind = "soft"
family = "speech"
rev = 1
module = "speech_providers"
summary = "Transcribe audio from an EnvPath or BlobRef with timestamped segments."

[[declarations]]
id = "openai-speech"
kind = "provider"
module = "speech_providers"
key = "openai-speech@0"
trigger = "lazy"
api = 1
failure = "fault"

[settings]
