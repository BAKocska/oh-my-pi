id = "examples.vector-memory"
entry = "vector_memory"
version = "0.1.0"
description = "Journal-backed vector memory with crash-isolated worker-side embedding and indexing."
requires = []
capabilities = ["env.fs.read", "env.fs.write", "journal.append", "place.worker"]

[[tools]]
name = "memory_put"
kind = "hard"

[[tools]]
name = "memory_query"
kind = "soft"

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
failure = "fail-closed"

[[workers]]
name = "vectors"
site = "env"
idle_ttl = "10m"
max_concurrency = 1
max_calls = 100000
restart = "on-failure"
warm = false

[workers.resources]
memory_bytes = 1073741824
open_files = 256

[settings]
