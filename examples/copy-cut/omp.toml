id = "examples.copy-cut"
entry = "copy_cut"
version = "0.1.0"
description = "Cut composer text to the client clipboard and restore the last session cut."
requires = []
capabilities = ["journal.append", "ui.shortcuts", "ui.commands"]

[[declarations]]
id = "cut-composer"
kind = "shortcut"
module = "copy_cut"
key = "alt+shift+x"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "paste-cut"
kind = "command"
module = "copy_cut"
key = "paste-cut"
trigger = "lazy"
api = 1
failure = "fault"
