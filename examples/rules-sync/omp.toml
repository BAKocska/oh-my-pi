id = "examples.rules-sync"
entry = "rules_sync"
kind = "extension"
version = "0.1.0"
description = "Static repository rules with declared conformity checks and durable decision capture."
requires = []
capabilities = ["env.exec", "journal.append"]

[[tools]]
name = "rules_check"
kind = "soft"
family = "rules"
rev = 1
module = "rules_sync"
summary = "Run the repository's declared conformity checks."

[[hooks]]
event = "tool_result"
phase = "observe"
module = "rules_sync"
failure = "fail-open"

[[hooks]]
event = "agent_settled"
phase = "domain"
module = "rules_sync"
failure = "fail-open"

[[skills]]
name = "repository-rules"
kind = "skills"
path = "rules_sync/skills/repository-rules/SKILL.md"
slot = "rules"
class = "stable"
priority = 100
description = "Always-applied repository engineering and decision-record rules."

[settings]
timeout = "2m"
decision_paths = ["AGENTS.md", "adr/**", "decisions/**", "docs/adr/**", "docs/decisions/**"]

[settings.commands]
unmerged = "git diff --quiet --diff-filter=U"
whitespace = "git diff --check"
