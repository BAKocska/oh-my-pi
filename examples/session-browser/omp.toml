id = "examples.session-browser"
entry = "session_browser"
version = "0.1.0"
description = "Indexed session browser with explicit approval-shaped deletion."
requires = []
capabilities = ["sessions.read", "ui.commands", "ui.dialogs"]

[[hooks]]
event = "command_invoke"
phase = "approval"
order = 0
failure = "fail-closed"

[[declarations]]
id = "sessions"
kind = "command"
module = "session_browser"
key = "sessions"
trigger = "lazy"
api = 1
failure = "fault"
