id = "examples.legible"
entry = "legible"
version = "0.1.0"
description = "Rewrite assistant prose once and re-render it without changing the journal."
requires = []
capabilities = ["inference:completion", "journal.append", "ui.commands"]

[[declarations]]
id = "assistant-legible-renderer"
kind = "message_renderer"
module = "legible"
key = "assistant"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "legible"
kind = "command"
module = "legible"
key = "legible"
trigger = "lazy"
api = 1
failure = "fault"

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "legible"
failure = "fail-open"

[[hooks]]
event = "turn_end"
phase = "observe"
order = 0
module = "legible"
failure = "fail-open"

[settings]
role = "smol"
rules = "Improve clarity and scanability while preserving every fact, qualification, code block, quotation, link, and instruction. Do not add commentary."
