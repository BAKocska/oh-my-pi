id = "examples.fuzzy-index"
entry = "fuzzy_index"
version = "0.1.0"
description = "Warm Environment-colocated fuzzy path and content index."
requires = []
capabilities = ["env.doc.read", "env.search", "place.worker"]

[[tools]]
name = "ffind"
kind = "soft"
family = "fff"
rev = 1
module = "fuzzy_index"
summary = "Fuzzy-search indexed workspace paths."

[[tools]]
name = "fgrep"
kind = "soft"
family = "fff"
rev = 1
module = "fuzzy_index"
summary = "Fuzzy-search indexed workspace content."

[[workers]]
name = "fuzzy-index"
site = "env"
warm = true
idle_ttl = "0s"
max_concurrency = 8
restart = "on-failure"

[settings]
