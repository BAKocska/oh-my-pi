id = "examples.bash-timeout"
entry = "bash_timeout"
kind = "extension"
version = "0.1.0"
description = "Clamp excessive bash tool-call timeouts before admission."
requires = []
capabilities = []

[[hooks]]
event = "tool_call"
phase = "transform"
order = 100
failure = "fail-closed"

[settings.max_timeout]
type = "string"
default = "10m"
description = "Maximum duration allowed for a bash tool call."
