id = "examples.foreign-commands"
entry = "foreign_commands"
version = "0.1.0"
description = "Prompt-only imports from recognized foreign CLI command layouts."
requires = []
capabilities = ["env.fs.read", "env.doc.read", "ui.commands"]

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "foreign_commands"
failure = "fail-open"

[settings.foreign_roots]
type = "string"
default = "[]"
description = "JSON array of .claude/commands, .codex/prompts, or .gemini/commands roots."

[settings.plugin_root]
type = "string"
default = ""
description = "Containment root allowed for literal ${PLUGIN_ROOT} expansion."
