id = "examples.computer-use"
entry = "computer_use"
version = "0.1.0"
description = "Blob-backed desktop automation isolated in a persistent native-driver worker."
requires = []
capabilities = ["place.worker"]

[[tools]]
name = "computer"
kind = "soft"
family = "cu"
rev = 1
module = "computer_use"
summary = "Desktop screenshots, pointer, keyboard, scrolling, and window control."

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "computer_use"
failure = "fail-closed"

[[workers]]
name = "driver"
site = "local"
idle_ttl = "10m"
max_concurrency = 1
restart = "on-failure"

[settings]
