id = "examples.ghost-suggestions"
entry = "ghost_suggestions"
version = "0.1.0"
description = "Native prompt-history completions with lock-free inline ghost hints."
requires = []
capabilities = ["sessions.read", "ui.ghost"]

[[declarations]]
id = "prompt-suggestions"
kind = "completion"
module = "ghost_suggestions"
key = ""
trigger = "eager-ui"
api = 1
failure = "fail-open"

[settings.snippets]
type = "string"
default = '["Explain the trade-offs and recommend one option.", "Summarize what changed and how it was verified.", "What should I investigate next?"]'
description = "JSON array of reusable prompt snippets included in suggestions."
