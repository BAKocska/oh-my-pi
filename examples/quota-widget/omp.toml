id = "examples.quota-widget"
entry = "quota_widget"
version = "0.1.0"
description = "Durable receipt quota projection, status segment, and slash command."
requires = []
capabilities = ["sessions.read", "ui.slots", "ui.commands"]

[[declarations]]
id = "synthetic-provider"
kind = "provider"
module = "quota_widget"
key = "synthetic-provider@0"
trigger = "lazy"
api = 1
failure = "fault"

[[declarations]]
id = "quota"
kind = "command"
module = "quota_widget"
key = "quota"
trigger = "lazy"
api = 1
failure = "fault"

[[hooks]]
event = "provider_usage"
phase = "observe"
order = 100
failure = "fail-open"

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 100
failure = "fail-open"

[[hooks]]
event = "turn_end"
phase = "observe"
order = 100
failure = "fail-open"
