id = "examples.mcp-devices"
entry = "mcp_devices"
kind = "extension"
version = "0.1.0"
description = "Mount configured stdio MCP tools as schema-free omp devices."
requires = []
capabilities = ["env.process"]

[[tools]]
name = "mcp"
kind = "soft"
family = "mcp"
rev = 1
module = "mcp_devices"
summary = "Runtime-discovered MCP device subtree."

[[hooks]]
event = "extension_activate"
phase = "observe"
module = "mcp_devices"
failure = "fail-open"

[settings.servers]
type = "string"
default = "{}"
description = "JSON object mapping MCP server names to command, args, env, and disabled fields."
