id = "examples.pr-review"
entry = "pr_review"
version = "0.1.0"
description = "Parallel model-tiered pull-request reviews with validated findings and bounded live progress."
requires = []
capabilities = ["agents.spawn", "env.exec", "env.blob", "ui.slots"]

[[tools]]
name = "review"
kind = "soft"
family = "pr-review"
rev = 1
module = "pr_review"
summary = "Run parallel model-tiered reviewers over a bounded git diff."

[[tools]]
name = "review/publish"
kind = "soft"
family = "pr-review"
rev = 1
module = "pr_review"
summary = "Publish validated findings through a durable human approval gate."

[[hooks]]
event = "tool_call"
phase = "approval"
order = 0
failure = "fail-closed"

[settings]
areas = [
  { area = "correctness", model = "@slow", thinking = "hi", max_requests = 6, max_input_tokens = 160000, max_output_tokens = 24000, max_usd = 4.0, max_wall = "15m" },
  { area = "security", model = "@default", thinking = "hi", max_requests = 5, max_input_tokens = 120000, max_output_tokens = 18000, max_usd = 3.0, max_wall = "12m" },
  { area = "maintainability", model = "@smol", thinking = "med", max_requests = 4, max_input_tokens = 80000, max_output_tokens = 12000, max_usd = 1.5, max_wall = "10m" },
]
