id = "examples.model-alias"
entry = "model_alias"
version = "0.1.0"
description = "Declare provider-scoped model aliases and display names as catalog data."
requires = []
capabilities = []

[[declarations]]
id = "anthropic-model-aliases"
kind = "provider"
module = "model_alias"
key = "anthropic@0"
trigger = "eager"
api = 1
failure = "fault"

[[declarations]]
id = "openai-model-aliases"
kind = "provider"
module = "model_alias"
key = "openai@0"
trigger = "eager"
api = 1
failure = "fault"

[settings.aliases]
type = "string"
default = '''[
  {"provider":"anthropic","model":"claude-sonnet-4-6","alias":"sonnet","name":"Claude Sonnet"},
  {"provider":"openai","model":"gpt-5.6","alias":"gpt","name":"GPT 5.6"}
]'''
description = "JSON array of provider, model, alias, and optional name records."

[settings.provider_aliases]
type = "string"
default = '''[
  {"provider":"anthropic","name":"Anthropic"},
  {"provider":"openai","name":"OpenAI"}
]'''
description = "JSON array of provider and display-name records."
