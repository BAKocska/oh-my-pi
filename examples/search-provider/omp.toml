id = "examples.search-provider"
entry = "search_provider"
kind = "extension"
version = "0.1.0"
description = "Declared Brave search provider with typed Python response parsing and paging."
requires = []
capabilities = ["place_env", "env.net", "credentials.reveal"]

[[tools]]
name = "web_search"
kind = "soft"
family = "ws"
rev = 1
module = "search_provider"
summary = "Search the public web through the configured Brave API credential."

[[declarations]]
id = "brave-search"
kind = "provider"
module = "search_provider"
key = "brave-search@0"
trigger = "lazy"
api = 1
failure = "fault"

[settings]
credential_id = ""
