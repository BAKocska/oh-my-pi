id = "examples.trace-export"
entry = "trace_export"
version = "0.1.0"
description = "Declarative vendor trace export over process or OTLP targets."
requires = []
capabilities = ["env.process", "network:https://api.braintrust.dev", "telemetry.capture_structure"]

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
failure = "open"

[[telemetry]]
kinds = ["turn_start", "turn_end", "model_request", "model_attempt", "provider_error", "tool_call"]
scope = "tree"
queue = 4096
overflow = "drop_oldest"

[[workers]]
name = "bt-trace-daemon"
site = "env"
idle_ttl = "5m"
max_concurrency = 1
restart = "on-failure"

[settings]
target = "process"
process = "bt-trace-daemon"
otlp_endpoint = "https://api.braintrust.dev/otel"
