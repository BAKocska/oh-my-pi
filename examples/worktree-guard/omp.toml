id = "examples.worktree-guard"
entry = "worktree_guard"
version = "0.1.0"
description = "Require durable approval for Git operations that disrupt a shared worktree."
requires = []
capabilities = ["env.fs.read"]

[[hooks]]
event = "tool_call"
phase = "precheck"
order = 0
failure = "fail-closed"

[[hooks]]
event = "tool_call"
phase = "approval"
order = 0
failure = "fail-closed"

[settings]
timeout = "30s"
default_on_timeout = false
