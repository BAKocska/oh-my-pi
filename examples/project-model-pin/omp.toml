id = "examples.project-model-pin"
entry = "project_model_pin"
version = "0.1.0"
description = "Project-scoped model pinning with a session-local manual override latch."
requires = []
capabilities = ["journal.append", "ui.commands"]

[[hooks]]
event = "model_changed"
phase = "observe"
order = 0
failure = "fail-open"

[[hooks]]
event = "turn_start"
phase = "transform"
order = 40
failure = "fail-open"

[[declarations]]
id = "pin_model"
kind = "command"
module = "project_model_pin"
key = "pin_model"
trigger = "lazy"
api = 1
failure = "fault"
