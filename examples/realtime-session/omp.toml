id = "examples.realtime-session"
entry = "realtime_session"
version = "0.1.0"
description = "Invocation-scoped realtime voice streaming through an Environment-owned transport."
requires = []
capabilities = ["provider", "env.process", "env.blob", "network:https://api.openai.com"]

[[tools]]
name = "realtime"
kind = "soft"
family = "voice"
rev = 1
module = "realtime_session"
summary = "Open one realtime voice session and return transcript plus blob-backed audio."

[[declarations]]
id = "openai-realtime"
kind = "provider"
module = "realtime_session"
key = "openai-realtime@0"
trigger = "lazy"
api = 1
failure = "fault"

[settings]
