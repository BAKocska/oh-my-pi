id = "examples.profiles"
entry = "profiles"
version = "0.1.0"
description = "Journal-backed model and device profiles with stable tool advertisement."
requires = []
capabilities = ["journal.append", "ui.commands"]

[[declarations]]
id = "profile"
kind = "command"
module = "profiles"
key = "profile"
trigger = "lazy"
api = 1
failure = "fault"

[[hooks]]
event = "turn_start"
phase = "transform"
order = 0
failure = "fail-open"

[settings]
profiles = [
  { name = "focused", model = { provider = "openai", api = "responses", model = "gpt-5.4" }, route = { provider = "openai", route = "default" }, thinking = "high", devices = ["diagnostics", "references", "symbols", "survey"] },
  { name = "fast", model = { provider = "anthropic", api = "messages", model = "claude-sonnet-4-6" }, route = { provider = "anthropic", route = "default" }, thinking = "low", devices = ["fetch_web", "web_search"] },
]
