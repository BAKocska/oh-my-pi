id = "examples.llama-switch"
entry = "llama_switch"
version = "0.1.0"
description = "Switch one supervised llama-server between named model flag sets."
requires = []
capabilities = ["env.process", "provider", "ui.commands"]

[[declarations]]
id = "llama-local"
kind = "provider"
module = "llama_switch"
key = "llama-local@0"
trigger = "lazy"
api = 1
failure = "fault"

[[declarations]]
id = "llama"
kind = "command"
module = "llama_switch"
key = "llama"
trigger = "lazy"
api = 1
failure = "fault"

[[hooks]]
event = "extension_activate"
phase = "observe"
failure = "fail-open"

[settings]
default = "code"

[settings.configs]
code = ["--model", "models/qwen2.5-coder-7b-q4_k_m.gguf", "--ctx-size", "32768", "--temp", "0.2", "--top-p", "0.9"]
vision = ["--model", "models/llava-7b-q4_k_m.gguf", "--mmproj", "models/llava-7b-mmproj-f16.gguf", "--ctx-size", "16384", "--temp", "0.1"]
long-context = ["--model", "models/llama-3.1-8b-q4_k_m.gguf", "--ctx-size", "65536", "--temp", "0.4", "--top-k", "40"]
