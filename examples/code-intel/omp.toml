id = "examples.code-intel"
entry = "code_intel"
kind = "extension"
version = "0.1.0"
description = "Language-server code intelligence with Environment-owned lifecycle and worker fan-out."
requires = []
capabilities = ["env.doc.read", "env.lsp", "place.env", "place.worker"]

[[tools]]
name = "diagnostics"
kind = "soft"
family = "ci"
rev = 1
module = "code_intel"
summary = "Return language-server diagnostics for a document."

[[tools]]
name = "references"
kind = "soft"
family = "ci"
rev = 1
module = "code_intel"
summary = "Return references for a source position."

[[tools]]
name = "symbols"
kind = "soft"
family = "ci"
rev = 1
module = "code_intel"
summary = "Return language-server symbols for a document."

[[tools]]
name = "survey"
kind = "soft"
family = "ci"
rev = 1
module = "code_intel"
summary = "Fan out diagnostics and symbol queries over many files."

[[workers]]
name = "code-intel"
site = "env"
idle_ttl = "2m"
max_concurrency = 8
restart = "no"
