id = "examples.skill-palette"
entry = "skill_palette"
version = "0.1.0"
description = "VS Code-style palette over core-discovered bundled skills."
requires = []
capabilities = ["journal.append", "ui.commands", "ui.dialogs"]

[[declarations]]
id = "palette"
kind = "command"
module = "skill_palette"
key = "palette"
trigger = "lazy"
api = 1
failure = "fault"

[[skills]]
path = "skill_palette/skills/focused-review/SKILL.md"
name = "palette-focused-review"
description = "Review a change by prioritizing correctness, regressions, and evidence."

[[skills]]
path = "skill_palette/skills/change-summary/SKILL.md"
name = "palette-change-summary"
description = "Summarize a change as behavior, risk, and verification."

[settings]
