id = "examples.tool-compose"
entry = "tool_compose"
version = "0.1.0"
description = "Compose an allowlisted device workflow with per-step admission."
requires = []
capabilities = ["place.worker"]

[[tools]]
name = "compose"
kind = "soft"
family = "workflow"
rev = 1
module = "tool_compose"
summary = "Run a bounded script whose device calls are independently admitted."

[[workers]]
name = "compose"
site = "local"
warm = true
idle_ttl = "5m"
max_concurrency = 4
restart = "on-failure"

[settings.allowed_devices]
type = "string"
default = "[]"
description = "JSON array of exact mounted device paths the compose script may invoke."

[settings.max_steps]
type = "number"
default = 8
min = 1
max = 32
step = 1
description = "Maximum device calls accepted in one compose script."
