id = "examples.context-report"
entry = "context_report"
version = "0.1.0"
description = "Model-invisible context attribution reports and a pressure status badge."
requires = []
capabilities = ["journal.append", "ui.commands", "ui.status"]

[[declarations]]
id = "context-command"
kind = "command"
module = "context_report"
key = "context"
trigger = "lazy"
api = 1
failure = "fault"

[[declarations]]
id = "context-report-renderer"
kind = "verdict_renderer"
module = "context_report"
key = "examples.context-report.report"
trigger = "lazy"
api = 1
failure = "fail-open"

[[telemetry]]
kinds = ["session_start", "model_request", "turn_end"]
scope = "self"
queue = 64
overflow = "drop_oldest"
module = "context_report"
