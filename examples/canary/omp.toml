id = "examples.canary"
entry = "canary"
version = "0.1.0"
description = "Stable prompt canary with settled-turn verification and durable failure status."
requires = []
capabilities = ["journal.append"]

[[tools]]
name = "canary_status"
kind = "soft"
family = "canary"
rev = 1
module = "canary"
summary = "Fold recent failed context-canary checks."

[[hooks]]
event = "before_agent_start"
phase = "observe"
order = 0
module = "canary"
failure = "fail-open"

[[hooks]]
event = "turn_end"
phase = "observe"
order = 0
module = "canary"
failure = "fail-open"
