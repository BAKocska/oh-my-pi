id = "examples.task-graph"
entry = "task_graph"
version = "0.1.0"
description = "Durable task and rule graph with a rebuildable adjacency index and stable active-rule prompt slot."
requires = []
capabilities = ["env.doc.read", "env.doc.write", "journal.append"]

[[tools]]
name = "graph"
kind = "soft"
family = "task_graph"
rev = 1
module = "task_graph"
summary = "Query the durable task-and-rule graph."

[[tools]]
name = "graph/task/add"
kind = "soft"
family = "task_graph"
rev = 1
module = "task_graph"
summary = "Add or update one durable task node."

[[tools]]
name = "graph/task/link"
kind = "soft"
family = "task_graph"
rev = 1
module = "task_graph"
summary = "Link a task to one prerequisite without creating a cycle."

[[tools]]
name = "graph/task/next"
kind = "soft"
family = "task_graph"
rev = 1
module = "task_graph"
summary = "List ready active tasks from the adjacency index."

[[tools]]
name = "graph/rule/list"
kind = "soft"
family = "task_graph"
rev = 1
module = "task_graph"
summary = "List deterministic durable rule snapshots."

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "task_graph"
failure = "fail-closed"
