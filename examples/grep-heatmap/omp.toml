id = "examples.grep-heatmap"
entry = "grep_heatmap"
version = "0.1.0"
description = "Graph heat annotations and an explicit typed repository code-map query."
requires = []
capabilities = ["env.fs.read"]

[[tools]]
name = "code_map"
kind = "soft"
family = ""
rev = 1
module = "grep_heatmap"
summary = "Diffuse identifier heat through a rebuildable repository co-occurrence graph."

[[hooks]]
event = "tool_result"
phase = "observe"
module = "grep_heatmap"
failure = "fail-open"
