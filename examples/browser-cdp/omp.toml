id = "examples.browser-cdp"
entry = "browser_cdp"
version = "0.1.0"
description = "Supervised Chrome DevTools Protocol navigation, evaluation, snapshots, and screenshots."
requires = []
capabilities = ["env.process", "env.blob"]

[[tools]]
name = "browser"
kind = "soft"
family = "cdp"
rev = 1
module = "browser_cdp"
summary = "Navigate, inspect, evaluate, capture, and close pages through supervised CDP."

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "browser_cdp"
failure = "fail-closed"

[settings]
executable = "chromium"
debug_port = 9222
headless = true
