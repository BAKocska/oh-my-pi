id = "examples.memory-fts"
entry = "memory_fts"
kind = "extension"
version = "0.1.0"
description = "Durable typed memory with an env-colocated rebuildable FTS index."
requires = []
capabilities = ["env.fs.read", "env.fs.write", "journal.append", "sessions.read", "place.env"]

[[tools]]
name = "memory_remember"
kind = "soft"
family = "mr"
rev = 1
module = "memory_fts"
summary = "Retain a typed fact, profile item, or standing instruction in project memory."

[[tools]]
name = "memory_search"
kind = "soft"
family = "ms"
rev = 1
module = "memory_fts"
summary = "Search durable memories and session text through a rebuildable FTS index."

[[hooks]]
event = "extension_activate"
phase = "observe"
module = "memory_fts"
failure = "fail-open"

[[hooks]]
event = "tool_result"
phase = "observe"
module = "memory_fts"
failure = "fail-open"
