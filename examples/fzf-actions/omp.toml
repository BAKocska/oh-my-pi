id = "examples.fzf-actions"
entry = "fzf_actions"
version = "0.1.0"
description = "Native shell-backed candidate pickers with safe composer, argv, and preview actions."
requires = []
capabilities = ["env.exec", "ui.commands", "ui.dialogs"]

[[declarations]]
id = "pick"
kind = "command"
module = "fzf_actions"
key = "pick"
trigger = "lazy"
api = 1
failure = "fault"

[settings]
pickers = { files = { candidates_cmd = "printf 'README.md\\tsource\\npyproject.toml\\tconfig\\n'", action = "insert-into-composer" }, checkout = { candidates_cmd = "git branch --format='%(refname:short)'", action = "run-command", command = ["git", "checkout", "{}"] }, preview = { candidates_cmd = "printf 'README.md\\n'", action = "open-overlay-preview" } }
