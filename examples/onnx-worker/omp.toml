id = "examples.onnx-worker"
entry = "onnx_worker"
version = "0.1.0"
description = "Crash-isolated warm local text generation and embeddings."
requires = []
capabilities = ["place.worker"]

[[tools]]
name = "local_infer"
kind = "soft"
family = "onnx"
rev = 1
module = "onnx_worker"
summary = "Generate text or embeddings with a warm local inference session."

[[workers]]
name = "onnx"
site = "local"
warm = false
idle_ttl = "10m"
max_concurrency = 2
max_calls = 100000
restart = "on-failure"

[settings]
