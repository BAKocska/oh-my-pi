id = "examples.tool-toggle"
entry = "tool_toggle"
version = "0.1.0"
description = "Provenance-grouped extension tool picker with persisted availability and visible context cost."
requires = []
capabilities = ["journal.append", "ui.commands"]

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "tool_toggle"
failure = "fail-open"

[[declarations]]
id = "tool-toggle"
kind = "command"
module = "tool_toggle"
key = "tool-toggle"
trigger = "lazy"
api = 1
failure = "fault"
