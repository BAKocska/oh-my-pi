id = "examples.calm-mode"
entry = "calm_mode"
version = "0.1.0"
description = "Toggle quiet transcript rendering without changing stored calls or model context."
requires = []
capabilities = ["journal.append", "ui.commands"]

[[declarations]]
id = "calm-command"
kind = "command"
module = "calm_mode"
key = "calm"
trigger = "lazy"
api = 1
failure = "fault"

[[declarations]]
id = "calm-reasoning-renderer"
kind = "message_renderer"
module = "calm_mode"
key = "reasoning"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "calm-read-renderer"
kind = "verdict_renderer"
module = "calm_mode"
key = "read@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "calm-bash-renderer"
kind = "verdict_renderer"
module = "calm_mode"
key = "bash@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "calm-grep-renderer"
kind = "verdict_renderer"
module = "calm_mode"
key = "grep@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "calm-glob-renderer"
kind = "verdict_renderer"
module = "calm_mode"
key = "glob@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "calm-edit-renderer"
kind = "verdict_renderer"
module = "calm_mode"
key = "edit@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "calm-write-renderer"
kind = "verdict_renderer"
module = "calm_mode"
key = "write@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "calm_mode"
failure = "fail-open"

[settings]
