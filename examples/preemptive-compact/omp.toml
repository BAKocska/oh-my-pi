id = "examples.preemptive-compact"
entry = "preemptive_compact"
version = "0.1.0"
description = "Triggers journal-backed proactive compaction with a durable hysteresis band."
requires = []
capabilities = ["journal.append"]

[[hooks]]
event = "turn_start"
phase = "observe"
order = 0
failure = "fail-open"

[[hooks]]
event = "compaction"
phase = "domain"
order = 0
failure = "fail-open"

[settings]
threshold = 0.80
hysteresis = 0.05
