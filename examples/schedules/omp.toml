id = "examples.schedules"
entry = "schedules"
kind = "extension"
version = "0.1.0"
description = "Declare and inspect durable prompt schedules owned by the core scheduler."
requires = []
capabilities = ["schedules", "schedules:project"]

[[tools]]
name = "schedule_prompt"
kind = "soft"
family = "schedule"
rev = 1
module = "schedules"
summary = "Upsert a durable cron schedule for an injected prompt or isolated task."

[[tools]]
name = "schedules_list"
kind = "soft"
family = "schedule"
rev = 1
module = "schedules"
summary = "List this extension's declared durable schedules."
