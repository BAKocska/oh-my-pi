id = "examples.discovery-lmstudio"
entry = "lmstudio"
version = "0.1.0"
description = "Discover local LM Studio models on a background catalog interval"
requires = []
capabilities = ["network:http://127.0.0.1:1234"]

[[hooks]]
event = "models_discover"
phase = "transform"
order = 0
failure = "fail-open"

[[declarations]]
id = "lmstudio"
kind = "provider"
module = "lmstudio"
key = "lmstudio@0"
trigger = "lazy"
api = 1
failure = "fault"
