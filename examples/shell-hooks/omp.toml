id = "examples.shell-hooks"
entry = "shell_hooks"
version = "0.1.0"
description = "Runs bounded Claude Code-compatible shell commands at mapped agent events."
requires = []
capabilities = ["env.exec"]

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "session_start"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "session_start"
phase = "precheck"
order = 0
module = "shell_hooks"
failure = "fail-closed"

[[hooks]]
event = "session_shutdown"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "compaction"
phase = "domain"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "compaction_done"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "tool_call"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "tool_call"
phase = "precheck"
order = 0
module = "shell_hooks"
failure = "fail-closed"

[[hooks]]
event = "tool_result"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "user_input"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[[hooks]]
event = "user_input"
phase = "precheck"
order = 0
module = "shell_hooks"
failure = "fail-closed"

[[hooks]]
event = "agent_end"
phase = "observe"
order = 0
module = "shell_hooks"
failure = "fail-open"

[settings]
Stop = { command = "cat >/dev/null", timeout = "2s", on_failure = "continue" }
