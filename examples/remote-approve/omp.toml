id = "examples.remote-approve"
entry = "remote_approve"
version = "0.1.0"
description = "Route durable approval tickets to a remote phone or watch service."
requires = []
capabilities = ["env.net", "schedules"]

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
failure = "fail-open"

[[hooks]]
event = "turn_start"
phase = "observe"
order = 0
failure = "fail-open"

[settings]
webhook = "https://approvals.example.invalid/omp"
poll_interval = "30s"
unreachable = "ask"
allow_fail_open = false
