id = "examples.settings-sync"
entry = "settings_sync"
version = "0.1.0"
description = "Conflict-safe USER-scope settings snapshots synchronized after agent idle."
requires = []
capabilities = ["env.net", "journal.append", "schedules"]

[credentials]
allow = ["settings-sync"]

[[tools]]
name = "settings_sync_push"
kind = "soft"
family = "settings-sync"
rev = 1
module = "settings_sync"
summary = "Push the local settings snapshot after a conflict-safe remote comparison."

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "settings_sync"
failure = "fail-open"

[settings.bundle]
type = "string"
default = "{}"
description = "JSON object containing the selected user settings to synchronize."

[settings.remote_url]
type = "string"
default = ""
description = "Remote conflict-safe snapshot endpoint."

[settings.quiet_period]
type = "string"
default = "5m"
description = "Agent idle duration before the durable push schedule fires."
