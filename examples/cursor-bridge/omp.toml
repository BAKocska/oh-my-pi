id = "examples.cursor-bridge"
entry = "cursor_bridge"
kind = "extension"
version = "0.1.0"
description = "Environment-owned proxy declaration for Cursor's foreign inference wire"
requires = []
capabilities = ["env.process"]

[credentials]
allow = ["cursor"]

[[declarations]]
id = "cursor"
kind = "provider"
module = "cursor_bridge"
key = "cursor@0"
trigger = "lazy"
api = 1
failure = "fault"

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "cursor_bridge"
failure = "fail-open"
