id = "examples.github-tools"
entry = "github_tools"
version = "0.1.0"
description = "Typed GitHub repository operations through one dynamic device."
requires = []
capabilities = ["env.net"]

[credentials]
allow = ["github"]

[[tools]]
name = "github"
kind = "soft"
family = "github"
rev = 1
module = "github_tools"
summary = "List and inspect GitHub repository resources through typed sub-path dispatch."

[[hooks]]
event = "tool_call"
phase = "approval"
order = 0
failure = "fail-closed"
