id = "examples.secret-guard"
entry = "secret_guard"
version = "0.1.0"
description = "Block secret-path reads and rely on Core-owned credential masking."
requires = []
capabilities = []

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
failure = "fail-closed"

[[hooks]]
event = "tool_call"
phase = "precheck"
order = -100
failure = "fail-closed"

[[hooks]]
event = "tool_call"
phase = "approval"
order = -100
failure = "fail-closed"

[[hooks]]
event = "tool_call"
phase = "observe"
order = 100
failure = "fail-open"

[settings.protected_paths]
type = "string"
default = '[".env*", "*.pem", "*.key", "*.p12", "*.pfx", "id_rsa", "id_ed25519", "secret-placeholder.key"]'
description = "JSON array of path globs denied when statically resolved and reviewed when dynamic."

[settings.secret_rules]
type = "string"
default = "[]"
description = "JSON array of custom SecretRule objects; Core already supplies credential patterns."
