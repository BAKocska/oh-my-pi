id = "examples.bash-guard"
entry = "bash_guard"
kind = "extension"
version = "0.1.0"
description = "Reviews non-read-only shell calls using core-supplied BashIR facts."
requires = []
capabilities = ["policy", "inference:completion", "journal.append"]

[[hooks]]
event = "tool_call"
phase = "precheck"
module = "bash_guard"
failure = "fail-closed"

[[hooks]]
event = "tool_call"
phase = "review"
module = "bash_guard"
failure = "fail-closed"

[[hooks]]
event = "tool_call"
phase = "observe"
module = "bash_guard"
failure = "fail-open"
