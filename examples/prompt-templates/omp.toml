id = "examples.prompt-templates"
entry = "prompt_templates"
version = "0.1.0"
description = "Frontmatter-configured Markdown prompt templates with safe expansion and supervised subagent chains."
requires = []
capabilities = ["ui.commands", "env.search", "env.doc.read", "agents.spawn"]

[[declarations]]
id = "tpl"
kind = "command"
module = "prompt_templates"
key = "tpl"
trigger = "lazy"
api = 1
failure = "fault"

[settings.templates_dir]
type = "string"
default = ".omp/templates"
description = "Workspace-relative directory containing Markdown prompt templates."
