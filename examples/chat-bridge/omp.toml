id = "examples.chat-bridge"
entry = "chat_bridge"
version = "0.1.0"
description = "Durable webhook bridge for bounded completion notices and session replies."
requires = []
capabilities = ["env.net"]

[credentials]
allow = ["chat-bridge"]

[[hooks]]
event = "session_start"
phase = "observe"
order = 0
failure = "fail-open"

[[hooks]]
event = "before_agent_start"
phase = "transform"
order = 0
failure = "fail-open"

[[hooks]]
event = "before_agent_start"
phase = "review"
order = 0
failure = "fail-open"

[[hooks]]
event = "agent_end"
phase = "observe"
order = 0
failure = "fail-open"

[settings]
webhook_url = ""
replies_url = ""
poll_interval = "60s"
