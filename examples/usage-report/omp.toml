id = "examples.usage-report"
entry = "usage_report"
version = "0.1.0"
description = "Durable receipt usage tables and today's spend statusline."
requires = []
capabilities = ["sessions.read", "ui.slots"]

[[tools]]
name = "usage_report"
kind = "soft"
family = "usage"
rev = 1
module = "usage_report"
summary = "Report durable session usage grouped by day, model, or project."

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 100
failure = "fail-open"

[[hooks]]
event = "turn_end"
phase = "observe"
order = 100
failure = "fail-open"
