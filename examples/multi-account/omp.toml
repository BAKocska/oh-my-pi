id = "examples.multi-account"
entry = "multi_account"
version = "0.1.0"
description = "Rotate credential accounts on typed quota and rate-limit failures."
requires = []
capabilities = []

[credentials]
allow = ["anthropic", "openai", "qwen", "ollama"]

[[tools]]
name = "accounts"
kind = "soft"

[[hooks]]
event = "provider_error"
phase = "domain"
order = 0
failure = "fail-closed"

[settings.accounts]
type = "string"
default = "anthropic:work,anthropic:personal,openai:work,openai:personal"
description = "Ordered named credential scopes as provider:identity pairs."

[settings.rate_limit_cooldown]
type = "string"
default = "15m"
description = "Fallback cooldown when a rate-limit response has no retry-after value."

[settings.quota_cooldown]
type = "string"
default = "6h"
description = "Cooldown applied to the current identity after quota exhaustion."
