id = "examples.provider-vertex"
entry = "vertex_provider"
kind = "extension"
version = "0.1.0"
description = "Region-scoped Anthropic models on Google Cloud Vertex AI"
requires = []
capabilities = []

[credentials]
allow = ["anthropic-vertex"]

[[declarations]]
id = "anthropic-vertex"
kind = "provider"
module = "vertex_provider"
key = "anthropic-vertex@0"
trigger = "eager"
api = 1
failure = "fault"

[[hooks]]
event = "provider_refresh"
phase = "domain"
order = 0
failure = "fail-closed"
