id = "examples.turn-phases"
entry = "turn_phases"
kind = "extension"
version = "0.1.0"
description = "Coalesced working-message status folded from typed turn lifecycle events."
requires = []
capabilities = ["ui.slots"]

[[hooks]]
event = "turn_start"
phase = "observe"
failure = "fail-open"

[[hooks]]
event = "before_request"
phase = "observe"
failure = "fail-open"

[[hooks]]
event = "message_start"
phase = "observe"
failure = "fail-open"
coalesce = "50ms"

[[hooks]]
event = "message_update"
phase = "observe"
failure = "fail-open"
coalesce = "50ms"

[[hooks]]
event = "call_open"
phase = "observe"
failure = "fail-open"
coalesce = "50ms"

[[hooks]]
event = "message_end"
phase = "observe"
failure = "fail-open"
coalesce = "50ms"

[[hooks]]
event = "tool_execution_start"
phase = "observe"
failure = "fail-open"

[[hooks]]
event = "tool_update"
phase = "observe"
failure = "fail-open"
coalesce = "50ms"

[[hooks]]
event = "tool_execution_end"
phase = "observe"
failure = "fail-open"

[[hooks]]
event = "capability_budget"
phase = "observe"
failure = "fail-open"

[[hooks]]
event = "compaction_done"
phase = "observe"
failure = "fail-open"

[[hooks]]
event = "turn_end"
phase = "observe"
failure = "fail-open"

[[hooks]]
event = "agent_end"
phase = "observe"
failure = "fail-open"
