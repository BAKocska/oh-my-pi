id = "examples.tool-search"
entry = "tool_search"
version = "0.1.0"
description = "Allowlisted model-driven availability control for schema-free devices."
requires = []
capabilities = []

[[tools]]
name = "tool_enable"
kind = "soft"
family = "tool-search"
rev = 1
module = "tool_search"
summary = "Enable one settings-allowlisted soft device at the next turn boundary."

[[tools]]
name = "tool_disable"
kind = "soft"
family = "tool-search"
rev = 1
module = "tool_search"
summary = "Disable one settings-allowlisted soft device at the next turn boundary."

[settings.allowlist]
type = "string"
default = ""
description = "Comma-separated device paths the model may enable or disable."
