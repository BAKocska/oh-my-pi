id = "examples.model-fallback"
entry = "model_fallback"
kind = "extension"
version = "0.1.0"
description = "Fail over through an explicit model chain using typed provider errors."
requires = []
capabilities = []

[[hooks]]
event = "provider_error"
phase = "domain"
order = 0
failure = "fail-closed"

[settings.model_fallback]
type = "enum"
values = ["deny", "chain"]
default = "chain"
description = "Selection policy; parent fallback is intentionally unavailable."

[settings.fallback_chain]
type = "string"
default = "anthropic/claude-sonnet-4-6,openai/gpt-5.6,kimi-code/kimi-k2-turbo"
description = "Explicit ordered provider/model chain, separated by commas."
