id = "examples.green-loop"
entry = "green_loop"
version = "0.1.0"
description = "Affected-test feedback after settled edits, on demand or after agent idle."
requires = []
capabilities = ["env.exec", "journal.append", "schedules", "ui.commands", "ui.slots"]

[[declarations]]
id = "green"
kind = "command"
module = "green_loop"
key = "green"
trigger = "lazy"
api = 1
failure = "fault"

[[hooks]]
event = "tool_result"
phase = "observe"
order = 0
module = "green_loop"
failure = "fail-open"

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
module = "green_loop"
failure = "fail-open"

[[hooks]]
event = "before_agent_start"
phase = "review"
order = 0
module = "green_loop"
failure = "fail-open"

[settings]
idle = "20s"
timeout = "10m"
test_runner = ""
affected = { node = { patterns = ["*.js", "*.jsx", "*.mjs", "*.cjs", "*.ts", "*.tsx"], command = "npm test -- --findRelatedTests {paths}" }, python = { patterns = ["*.py"], command = "python3 -m pytest {paths}" }, go = { patterns = ["*.go"], command = "go test ./..." }, rust = { patterns = ["*.rs"], command = "cargo test" }, make = { patterns = ["Makefile", "*.mk"], command = "make test" } }
