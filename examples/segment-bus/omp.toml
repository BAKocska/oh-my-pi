id = "examples.segment-bus"
entry = "segment_bus"
kind = "extension"
version = "0.1.0"
description = "A bounded status-segment bus exposed as a granted extension service."
requires = []
capabilities = ["ui.slots"]

[[services]]
name = "segments.publish"
rev = 1
module = "segment_bus"

[[hooks]]
event = "extension_activate"
phase = "observe"
module = "demo_publisher"
failure = "fail-open"

[features.demo_publisher]
entry = "demo_publisher"
default = true
description = "Publish one segment through the manifest-granted service client."
requires = ["segments.publish@1"]

[settings]
