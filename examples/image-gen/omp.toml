id = "examples.image-gen"
entry = "image_gen"
version = "0.1.0"
description = "Blob-backed image generation through a declared provider route."
requires = []
capabilities = ["provider", "journal.append"]

[[tools]]
name = "image_gen"
kind = "soft"
family = "img"
rev = 1
module = "image_gen"
summary = "Generate one or more media-typed images from a text prompt."

[[declarations]]
id = "openai-images"
kind = "provider"
module = "image_gen"
key = "openai-images@0"
trigger = "lazy"
api = 1
failure = "fault"

[settings]
