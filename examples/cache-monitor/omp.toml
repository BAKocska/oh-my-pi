id = "examples.cache-monitor"
entry = "cache_monitor"
kind = "extension"
version = "0.1.0"
description = "Records prompt-cache health and reports hit-rate regressions."
requires = []
capabilities = ["journal.append", "ui.status"]

[[tools]]
name = "cache_report"
kind = "soft"
family = "cmr"
rev = 1
module = "cache_monitor"
summary = "Summarize recent prompt-cache health observations."

[[telemetry]]
kinds = ["model_request"]
scope = "tree"
queue = 4096
overflow = "drop_oldest"
replay = true
replay_limit = 2048
module = "cache_monitor"
