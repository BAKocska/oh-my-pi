id = "examples.script-tools"
entry = "script_tools"
kind = "extension"
version = "0.1.0"
description = "Discover workspace shell scripts and mount them beneath one dynamic device parent."
requires = []
capabilities = ["env.doc.read", "env.exec", "env.search"]

[[tools]]
name = "scripts"
kind = "soft"
family = "script-tools"
rev = 1
module = "script_tools"
summary = "Runtime-discovered workspace script tools."

[[hooks]]
event = "extension_activate"
phase = "observe"
module = "script_tools"
failure = "fail-open"

[settings.scripts_dir]
type = "string"
default = ".omp/scripts"
description = "Workspace-relative directory containing annotated shell scripts."
