id = "examples.esc-steer"
entry = "esc_steer"
version = "0.1.0"
description = "Abort a running turn and continue with the next queued follow-up."
requires = []
capabilities = ["journal.append", "ui.commands", "ui.shortcuts"]

[[declarations]]
id = "queue"
kind = "command"
module = "esc_steer"
key = "queue"
trigger = "lazy"
api = 1
failure = "fault"

[[declarations]]
id = "abort-next"
kind = "shortcut"
module = "esc_steer"
key = "ctrl+alt+escape"
trigger = "lazy"
api = 1
failure = "fail-open"
