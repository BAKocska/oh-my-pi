id = "examples.observational-memory"
entry = "observational_memory"
version = "0.1.0"
description = "Folds settled tool outcomes into a journal-backed compaction summary."
requires = []
capabilities = ["journal.append"]

[[hooks]]
event = "tool_result"
phase = "observe"
order = 0
failure = "fail-open"

[[hooks]]
event = "compaction"
phase = "domain"
order = 0
failure = "fail-open"

[[hooks]]
event = "compaction_done"
phase = "observe"
order = 0
failure = "fail-open"

[[hooks]]
event = "agent_settled"
phase = "domain"
order = 0
failure = "settle"
