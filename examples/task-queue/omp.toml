id = "examples.task-queue"
entry = "task_queue"
version = "0.1.0"
description = "A durable hidden task queue with strictly serialized agent continuations."
requires = []
capabilities = ["journal.append", "ui.commands"]

[[tools]]
name = "queue_task"
kind = "soft"
family = "queue"
rev = 1
module = "task_queue"
summary = "Append a task to the hidden, strictly serialized session queue."

[[declarations]]
id = "task-queue-drain"
kind = "campaign"
module = "task_queue"
key = "task-queue-drain"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "queue_task"
kind = "command"
module = "task_queue"
key = "queue_task"
trigger = "lazy"
api = 1
failure = "fault"
