id = "examples.git-changes"
entry = "git_changes"
version = "0.1.0"
description = "On-demand working-tree browser with a coalesced dirty-file footer segment."
requires = []
capabilities = ["env.exec", "env.blob", "ui.slots", "ui.shortcuts", "ui.commands", "ui.dialogs"]

[[hooks]]
event = "extension_activate"
phase = "observe"
order = 0
failure = "fail-open"

[[declarations]]
id = "show-git-changes"
kind = "shortcut"
module = "git_changes"
key = "alt+shift+g"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "changes"
kind = "command"
module = "git_changes"
key = "changes"
trigger = "lazy"
api = 1
failure = "fault"
