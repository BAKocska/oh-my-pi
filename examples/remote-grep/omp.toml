id = "examples.remote-grep"
entry = "remote_grep"
kind = "extension"
version = "0.1.0"
description = "Lists, reads, and searches files on a supervisor-owned attached worker."
requires = []
capabilities = ["place_worker"]

[[tools]]
name = "remote_ls"
kind = "soft"
family = "hpc"
rev = 1
module = "remote_grep"
summary = "List path metadata on the attached worker."

[[tools]]
name = "remote_read"
kind = "soft"
family = "hpc"
rev = 1
module = "remote_grep"
summary = "Read bytes from a file on the attached worker."

[[tools]]
name = "remote_grep"
kind = "soft"
family = "hpc"
rev = 1
module = "remote_grep"
summary = "Search files on the attached worker and return only matches."

[[workers]]
name = "hpc"
site = "attached"
process = "hpc-login"
idle_ttl = "30m"
max_concurrency = 4
restart = "on-failure"
unmanaged = true
warm = false
