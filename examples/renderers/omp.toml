id = "examples.renderers"
entry = "renderers"
version = "0.1.0"
description = "Revision-keyed rendering for built-in read, bash, and grep verdicts."
requires = []
capabilities = []

[[declarations]]
id = "read-v1-renderer"
kind = "verdict_renderer"
module = "renderers"
key = "read@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "bash-v1-renderer"
kind = "verdict_renderer"
module = "renderers"
key = "bash@1"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "grep-v1-renderer"
kind = "verdict_renderer"
module = "renderers"
key = "grep@1"
trigger = "lazy"
api = 1
failure = "fail-open"
