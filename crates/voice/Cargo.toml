[package]
name = "omp-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = [
	"Can Bölük",
	"Stencil Labs, Inc.",
]
homepage.workspace = true
repository.workspace = true
description = "Cross-platform audio capture, playback, metering, and ownership coordination for OMP voice features"
readme = "README.md"

[features]
default = ["native-audio"]
native-audio = ["dep:libc", "dep:windows-sys"]
realtime-media = ["dep:audiopus_sys", "dep:opus", "dep:webrtc"]

[lints]
workspace = true

[dependencies]
flume.workspace = true
parking_lot.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, optional = true }
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
audiopus_sys = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }
