[target.'cfg(any(unix, windows))'.dependencies]
notify = { workspace = true }
rustix = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["feature", "hostname"] }
