syntax = "proto3";

package omp.env.v1;

import "omp/blob/v1/blob.proto";
import "omp/document/v1/document.proto";
import "omp/inference/v1/common.proto";
import "omp/policy/v1/policy.proto";
import "omp/thread/v1/thread.proto";

// Environment-daemon protocol. Each stdio, UDS, or in-process transport carries
// varint-length-delimited ClientFrame and ServerFrame messages. request_id 0 is
// reserved for the hello exchange and unsolicited events; ordinary request ids
// are nonzero and unique among in-flight operations.
//
// Evolution rules:
//   - Receivers skip unknown fields and enum values.
//   - Experimental extensions use a namespaced ValueMap at tag 15.
//   - Field numbers are never reused; removed fields are reserved.
//   - An EventStreamError terminates only the named event stream. No later
//     event on that stream may be treated as contiguous.

message ClientHello {
  string client = 1;
  uint32 schema_rev = 2;
  repeated string capabilities = 3;
  bytes client_id = 4;
  omp.inference.v1.ValueMap props = 15;
}

message ServerHello {
  uint32 schema_rev = 1;
  uint32 min_schema_rev = 2;
  repeated string capabilities = 3;
  string server_version = 4;
  bytes workspace_id = 5;
  string root_uri = 6;
  bytes server_epoch = 7;
  // Content hash identifying the build of the serving executable; empty when
  // the server could not determine its own build identity.
  string server_build = 8;
  omp.inference.v1.ValueMap props = 15;
}

// Asks the daemon to retire its listening socket: stop accepting new
// connections, drain, and release the endpoint. Sent by a newer-build client
// replacing a stale owner.
message Retire {
  omp.inference.v1.ValueMap props = 15;
}

// Acknowledges that retirement has begun.
message RetireStarted {
  omp.inference.v1.ValueMap props = 15;
}

// Opens the streaming channel for one tool call. The env may prepare work after
// this request, but must not perform effects until ArgsCommitted arrives.
message InvokeTool {
  string invocation_id = 1;
  string name = 2;
  string rev = 3;
  uint64 deadline_ms = 4;
  omp.inference.v1.ValueMap props = 15;
}

message InvokeAccepted {
  string invocation_id = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ArgText {
  string invocation_id = 1;
  string fragment = 2;
  omp.inference.v1.ValueMap props = 15;
}

// The sole effect-commit gate. raw is the exact committed UTF-8 argument text.
message ArgsCommitted {
  string invocation_id = 1;
  bytes raw = 2;
  omp.inference.v1.ValueMap props = 15;
}

enum InterruptClass {
  INTERRUPT_CLASS_UNSPECIFIED = 0;
  INTERRUPT_CLASS_IMMEDIATE = 1;
  INTERRUPT_CLASS_TURN_BOUNDARY = 2;
  INTERRUPT_CLASS_IDLE = 3;
  INTERRUPT_CLASS_DEADLINE = 4;
}

message Interrupt {
  string invocation_id = 1;
  string reason = 2;
  InterruptClass class = 3;
  omp.inference.v1.ValueMap props = 15;
}

message Update {
  string invocation_id = 1;
  bytes json = 2;
  omp.inference.v1.ValueMap props = 15;
}

// Terminal omp-tool Verdict JSON, except Detached sends Outcome::Detached.
// Model-facing parts remain canonical thread vocabulary.
message Verdict {
  string invocation_id = 1;
  bytes json = 2;
  repeated omp.thread.v1.Part parts = 3;
  // Whether the structured verdict is a fault, argument error, or abort.
  bool is_error = 4;
  // Whether model-facing parts may be compacted while structured truth remains.
  bool useless = 5;
  omp.inference.v1.ValueMap props = 15;
}

message EnvironmentDelta {
  map<string, string> set = 1;
  repeated string unset = 2;
  omp.inference.v1.ValueMap props = 15;
}

message PtySpec {
  uint32 rows = 1;
  uint32 columns = 2;
  string terminal = 3;
  omp.inference.v1.ValueMap props = 15;
}

message SessionLeaseSpec {
  uint64 ttl_ms = 1;
  omp.inference.v1.ValueMap props = 15;
}

message OpenSessionRequest {
  string cwd_uri = 1;
  EnvironmentDelta env_delta = 2;
  optional PtySpec pty = 3;
  optional SessionLeaseSpec lease = 4;
  omp.inference.v1.ValueMap props = 15;
}

message OpenSessionResponse {
  bytes session = 1;
  bytes lease = 2;
  string cwd_uri = 3;
  omp.inference.v1.ValueMap props = 15;
}

message CloseSessionRequest {
  bytes session = 1;
  omp.inference.v1.ValueMap props = 15;
}

message CloseSessionResponse {
  bytes session = 1;
  omp.inference.v1.ValueMap props = 15;
}

message Script {
  string text = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ExecRequest {
  bytes session = 1;
  Script source = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ExecStarted {
  bytes session = 1;
  bytes exec = 2;
  omp.inference.v1.ValueMap props = 15;
}

message StdinFrame {
  bytes exec = 1;
  oneof input {
    bytes data = 2;
    bool eof = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}

message SignalRequest {
  bytes exec = 1;
  string signal = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ResizeRequest {
  bytes exec = 1;
  uint32 rows = 2;
  uint32 columns = 3;
  omp.inference.v1.ValueMap props = 15;
}

enum OutputChannel {
  OUTPUT_CHANNEL_UNSPECIFIED = 0;
  OUTPUT_CHANNEL_STDOUT = 1;
  OUTPUT_CHANNEL_STDERR = 2;
  OUTPUT_CHANNEL_PTY = 3;
}

message OutputFrame {
  bytes exec = 1;
  OutputChannel channel = 2;
  bytes data = 3;
  uint64 sequence = 4;
  omp.inference.v1.ValueMap props = 15;
}

enum ExecOutcome {
  EXEC_OUTCOME_UNSPECIFIED = 0;
  EXEC_OUTCOME_EXITED = 1;
  EXEC_OUTCOME_FAILED = 2;
  EXEC_OUTCOME_TIMEOUT = 3;
  EXEC_OUTCOME_CANCELLED = 4;
  EXEC_OUTCOME_DENIED = 5;
}

message ExecStatusMsg {
  ExecOutcome outcome = 1;
  optional int32 exit_code = 2;
  string signal = 3;
  uint64 wall_clock_ms = 4;
  optional omp.thread.v1.Blob spilled_output = 5;
  bool aborted = 6;
  omp.inference.v1.ValueMap props = 15;
}

message ExitEvent {
  bytes exec = 1;
  ExecStatusMsg status = 2;
  omp.inference.v1.ValueMap props = 15;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  RESTART_POLICY_NEVER = 1;
  RESTART_POLICY_ON_FAILURE = 2;
  RESTART_POLICY_ALWAYS = 3;
}

message RestartSpec {
  RestartPolicy policy = 1;
  uint64 delay_ms = 2;
  optional uint32 max_restarts = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessSpec {
  Script source = 1;
  string cwd_uri = 2;
  EnvironmentDelta env_delta = 3;
  optional PtySpec pty = 4;
  RestartSpec restart = 5;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyProbe {
  oneof probe {
    ReadyLog log = 1;
    ReadyTcp tcp = 2;
    ReadyPing ping = 4;
  }
  uint64 timeout_ms = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyLog {
  string pattern = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyTcp {
  string host = 1;
  uint32 port = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyPing {
  uint64 nonce = 1;
  omp.inference.v1.ValueMap props = 15;
}

message StartProcess {
  string name = 1;
  ProcessSpec spec = 2;
  optional ReadyProbe ready = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessStarted {
  string name = 1;
  uint64 generation = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ListProcesses {
  omp.inference.v1.ValueMap props = 15;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_STARTING = 1;
  PROCESS_STATE_READY = 2;
  PROCESS_STATE_RUNNING = 3;
  PROCESS_STATE_EXITED = 4;
  PROCESS_STATE_STOPPED = 5;
  PROCESS_STATE_FAILED = 6;
}

message ProcessInfo {
  string name = 1;
  uint64 generation = 2;
  ProcessState state = 3;
  ExecStatusMsg status = 4;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessList {
  repeated ProcessInfo processes = 1;
  omp.inference.v1.ValueMap props = 15;
}

message AttachOutput {
  string name = 1;
  uint64 after_sequence = 2;
  omp.inference.v1.ValueMap props = 15;
}

message OutputAttached {
  string name = 1;
  uint64 generation = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessOutput {
  string name = 1;
  uint64 generation = 2;
  OutputChannel channel = 3;
  bytes data = 4;
  uint64 sequence = 5;
  omp.inference.v1.ValueMap props = 15;
}

message SendInput {
  string name = 1;
  oneof input {
    bytes data = 2;
    bool eof = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}

message SignalProcess {
  string name = 1;
  string signal = 2;
  omp.inference.v1.ValueMap props = 15;
}

message StopProcess {
  string name = 1;
  uint64 grace_ms = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessStateEvent {
  ProcessInfo process = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessCommandAccepted {
  string name = 1;
  omp.inference.v1.ValueMap props = 15;
}

// Marks the end of one frame-multiplexed Put stream. Preceding frames carrying
// the same request_id contain omp.blob.v1.Chunk values in order.
message CommitBlobPut {
  omp.inference.v1.ValueMap props = 15;
}

message BlobGetComplete {
  bytes hash = 1;
  uint64 bytes_sent = 2;
  omp.inference.v1.ValueMap props = 15;
}

message CancelRequest {
  oneof target {
    uint64 target_request_id = 1;
    string invocation_id = 2;
    bytes exec = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}

enum EventStreamKind {
  EVENT_STREAM_KIND_UNSPECIFIED = 0;
  EVENT_STREAM_KIND_INVOCATION = 1;
  EVENT_STREAM_KIND_EXEC = 2;
  EVENT_STREAM_KIND_PROCESS_OUTPUT = 3;
  EVENT_STREAM_KIND_PROCESS_STATE = 4;
  reserved 5;
  EVENT_STREAM_KIND_DOCUMENT = 6;
  EVENT_STREAM_KIND_LSP_REGISTRY = 7;
  EVENT_STREAM_KIND_WALK = 8;
  EVENT_STREAM_KIND_SEARCH = 9;
}

enum EventStreamFailure {
  EVENT_STREAM_FAILURE_UNSPECIFIED = 0;
  EVENT_STREAM_FAILURE_LAGGED = 1;
  EVENT_STREAM_FAILURE_CLOSED = 2;
  EVENT_STREAM_FAILURE_SYNCHRONIZATION = 3;
}

message EventStreamError {
  EventStreamKind stream = 1;
  EventStreamFailure failure = 2;
  string invocation_id = 3;
  bytes exec = 4;
  string process_name = 5;
  uint64 skipped_events = 6;
  string message = 7;
  omp.inference.v1.ValueMap props = 15;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_INVALID_ARGUMENT = 1;
  PROTOCOL_ERROR_CODE_NOT_FOUND = 2;
  PROTOCOL_ERROR_CODE_PERMISSION_DENIED = 3;
  PROTOCOL_ERROR_CODE_UNSUPPORTED = 4;
  PROTOCOL_ERROR_CODE_INTERNAL = 5;
  PROTOCOL_ERROR_CODE_ALREADY_EXISTS = 6;
  PROTOCOL_ERROR_CODE_PRECONDITION_FAILED = 7;
  PROTOCOL_ERROR_CODE_CANCELLED = 8;
  PROTOCOL_ERROR_CODE_DEADLINE_EXCEEDED = 9;
  PROTOCOL_ERROR_CODE_UNCOMMITTED = 10;
  // 11 and 12 were proposed for a deferred sandbox protocol and remain
  // unavailable so a future implementation cannot silently reuse them.
  reserved 11, 12;
  PROTOCOL_ERROR_CODE_RESOURCE_EXHAUSTED = 13;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  omp.inference.v1.ValueMap props = 15;
}

// Admission is the only direct post-v1 addition because ordering it between
// InvokeTool and ArgsCommitted is part of the invocation state machine.
message AdmitInvocation {
  string invocation_id = 1;
  optional omp.policy.v1.BashIr bash = 2;
  uint64 deadline_ms = 3;
  omp.inference.v1.ValueMap props = 15;
}

message Admission {
  string invocation_id = 1;
  bool allow = 2;
  optional omp.policy.v1.PolicyDenied denied = 3;
  // RFC 7386 merge patch over the effective argument object.
  bytes args_patch = 4;
  omp.inference.v1.ValueMap props = 15;
}

// Reuses the canonical document, filesystem, and LSP request vocabulary.
message DocumentOp {
  oneof op {
    omp.document.v1.OpenDocumentRequest open = 1;
    omp.document.v1.CloseDocumentRequest close = 2;
    omp.document.v1.ReadDocumentRequest read = 3;
    omp.document.v1.SummarizeDocumentRequest summarize = 4;
    omp.document.v1.CommitTransactionRequest commit_transaction = 5;
    omp.document.v1.CanonicalizePathRequest canonicalize = 6;
    omp.document.v1.StatPathRequest stat = 7;
    omp.document.v1.ListDirectoryRequest list_directory = 8;
    omp.document.v1.CreateDirectoryRequest create_directory = 9;
    omp.document.v1.RemovePathRequest remove = 10;
    omp.document.v1.RenamePathRequest rename = 11;
    omp.document.v1.CopyPathRequest copy = 12;
    omp.document.v1.ReadLinkRequest read_link = 13;
    omp.document.v1.CreateSymlinkRequest create_symlink = 14;
    omp.document.v1.CreateHardLinkRequest create_hard_link = 16;
    omp.document.v1.SetPermissionsRequest set_permissions = 17;
    omp.document.v1.GetLspBindingsRequest get_lsp_bindings = 18;
    omp.document.v1.LspRequest lsp_request = 19;
    omp.document.v1.LspNotificationRequest lsp_notification = 20;
  }
  omp.inference.v1.ValueMap props = 15;
}

message DocumentResult {
  oneof result {
    omp.document.v1.OpenDocumentResponse opened = 1;
    omp.document.v1.CloseDocumentResponse closed = 2;
    omp.document.v1.ReadDocumentResponse read = 3;
    omp.document.v1.SummarizeDocumentResponse summarized = 4;
    omp.document.v1.CommitTransactionResponse transaction = 5;
    omp.document.v1.CanonicalizePathResponse canonicalized = 6;
    omp.document.v1.StatPathResponse stat = 7;
    omp.document.v1.ListDirectoryResponse directory = 8;
    omp.document.v1.CreateDirectoryResponse directory_created = 9;
    omp.document.v1.RemovePathResponse removed = 10;
    omp.document.v1.RenamePathResponse renamed = 11;
    omp.document.v1.CopyPathResponse copied = 12;
    omp.document.v1.ReadLinkResponse link = 13;
    omp.document.v1.CreateSymlinkResponse symlink_created = 14;
    omp.document.v1.CreateHardLinkResponse hard_link_created = 16;
    omp.document.v1.SetPermissionsResponse permissions_set = 17;
    omp.document.v1.GetLspBindingsResponse lsp_bindings = 18;
    omp.document.v1.LspResponse lsp_response = 19;
    omp.document.v1.LspNotificationResponse lsp_notified = 20;
  }
  omp.inference.v1.ValueMap props = 15;
}

enum WalkFollowLinks {
  WALK_FOLLOW_LINKS_UNSPECIFIED = 0;
  WALK_FOLLOW_LINKS_NEVER = 1;
  WALK_FOLLOW_LINKS_ROOTS = 2;
  WALK_FOLLOW_LINKS_ALWAYS = 3;
}
enum WalkDetail {
  WALK_DETAIL_UNSPECIFIED = 0;
  WALK_DETAIL_MINIMAL = 1;
  WALK_DETAIL_FULL = 2;
}
enum WalkOrder {
  WALK_ORDER_UNSPECIFIED = 0;
  WALK_ORDER_NATIVE = 1;
  WALK_ORDER_PATH = 2;
}
enum DirectoryErrorMode {
  DIRECTORY_ERROR_MODE_UNSPECIFIED = 0;
  DIRECTORY_ERROR_MODE_SKIP_SKIPPABLE = 1;
  DIRECTORY_ERROR_MODE_VISIT = 2;
}
message WalkOptionsMsg {
  bool include_hidden = 1;
  bool use_gitignore = 2;
  bool skip_git = 3;
  bool skip_node_modules = 4;
  WalkFollowLinks follow_links = 5;
  WalkDetail detail = 6;
  WalkOrder order = 7;
  bool emit_root = 8;
  uint64 min_depth = 9;
  uint64 max_depth = 10;
  bool contents_first = 11;
  DirectoryErrorMode directory_errors = 12;
  bool same_file_system = 13;
  bool cache = 14;
  omp.inference.v1.ValueMap props = 15;
}
message WalkRequest {
  string root_uri = 1;
  WalkOptionsMsg options = 2;
  repeated string include = 3;
  repeated string exclude = 4;
  optional uint64 limit = 5;
  omp.inference.v1.ValueMap props = 15;
}
message WalkEntry {
  string path = 1;
  omp.document.v1.FileKind kind = 2;
  optional double mtime_ms = 3;
  optional double size = 4;
  uint64 depth = 5;
  omp.inference.v1.ValueMap props = 15;
}
message WalkComplete {
  uint64 scanned_entries = 1;
  uint64 filtered_entries = 2;
  uint64 limited_entries = 3;
  uint64 cache_age_ms = 4;
  bool cached = 5;
  omp.inference.v1.ValueMap props = 15;
}
message SearchRequest {
  WalkRequest walk = 1;
  bytes pattern = 2;
  bool case_sensitive = 3;
  optional uint64 limit = 4;
  omp.inference.v1.ValueMap props = 15;
}
message SearchMatchMsg {
  string path = 1;
  uint64 line = 2;
  uint64 byte_offset = 3;
  bytes line_bytes = 4;
  omp.inference.v1.ValueMap props = 15;
}
message SearchComplete {
  uint64 files_scanned = 1;
  uint64 matches = 2;
  bool limited = 3;
  omp.inference.v1.ValueMap props = 15;
}

enum WorkerSiteKind {
  WORKER_SITE_KIND_UNSPECIFIED = 0;
  WORKER_SITE_KIND_ENV = 1;
  WORKER_SITE_KIND_LOCAL = 2;
  WORKER_SITE_KIND_ATTACHED = 3;
}
message WorkerSite {
  WorkerSiteKind kind = 1;
  optional string process = 2;
  optional ReadyProbe ready = 3;
  omp.inference.v1.ValueMap props = 15;
}
message WorkerLimits {
  optional uint64 memory_bytes = 1;
  optional double cpu_shares = 2;
  optional uint64 open_files = 3;
  optional uint64 wall_clock_ms = 4;
  omp.inference.v1.ValueMap props = 15;
}
message WorkerSpec {
  string name = 1;
  WorkerSite site = 2;
  RestartSpec restart = 3;
  optional ReadyProbe ready = 4;
  uint64 idle_ttl_ms = 5;
  uint32 max_concurrency = 6;
  optional uint64 max_calls = 7;
  WorkerLimits limits = 8;
  string cwd_uri = 9;
  EnvironmentDelta env_delta = 10;
  bool readonly = 11;
  bool unmanaged = 12;
  bool warm = 13;
  omp.inference.v1.ValueMap props = 15;
}
enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  WORKER_STATE_SPAWNING = 1;
  WORKER_STATE_BOOTING = 2;
  WORKER_STATE_READY = 3;
  WORKER_STATE_DRAINING = 4;
  WORKER_STATE_EVICTED = 5;
  WORKER_STATE_FAILED = 6;
}
message WorkerInfo {
  string name = 1;
  uint64 generation = 2;
  WorkerState state = 3;
  WorkerSite site = 4;
  optional uint64 pid = 5;
  uint64 spawned_at_ms = 6;
  optional uint64 last_call_at_ms = 7;
  uint64 calls = 8;
  uint32 in_flight = 9;
  uint64 code_cached = 10;
  repeated string enforced = 11;
  optional string fault = 12;
  omp.inference.v1.ValueMap props = 15;
}
message OpenWorker {
  string name = 1;
  WorkerSpec spec = 2;
  omp.inference.v1.ValueMap props = 15;
}
message WorkerOpened {
  string name = 1;
  uint64 generation = 2;
  bytes authkey = 3;
  omp.inference.v1.ValueMap props = 15;
}
message WorkerData {
  string name = 1;
  uint64 generation = 2;
  uint32 channel = 3;
  bytes data = 4;
  omp.inference.v1.ValueMap props = 15;
}
message CloseWorker {
  string name = 1;
  uint64 generation = 2;
  uint64 grace_ms = 3;
  omp.inference.v1.ValueMap props = 15;
}
message GetWorkerInfo {
  string name = 1;
  omp.inference.v1.ValueMap props = 15;
}
message ListWorkers {
  omp.inference.v1.ValueMap props = 15;
}
message WorkerList {
  repeated WorkerInfo workers = 1;
  omp.inference.v1.ValueMap props = 15;
}
message WorkerEvent {
  WorkerInfo info = 1;
  omp.inference.v1.ValueMap props = 15;
}
message WorkerOp {
  oneof op {
    OpenWorker open = 1;
    CloseWorker close = 2;
    WorkerData data = 3;
    GetWorkerInfo info = 4;
    ListWorkers list = 5;
  }
  omp.inference.v1.ValueMap props = 15;
}
message WorkerResult {
  oneof result {
    WorkerOpened opened = 1;
    WorkerInfo info = 2;
    WorkerList list = 3;
    WorkerData data = 4;
    ProcessCommandAccepted closed = 5;
  }
  omp.inference.v1.ValueMap props = 15;
}

message SnapshotWorkspace {
  string scope = 1;
  repeated string paths = 2;
  omp.inference.v1.ValueMap props = 15;
}
message WorkspaceSnapshot {
  string snapshot_id = 1;
  bytes manifest_hash = 2;
  uint64 files = 3;
  uint64 bytes = 4;
  omp.inference.v1.ValueMap props = 15;
}
enum ConflictReason {
  CONFLICT_REASON_UNSPECIFIED = 0;
  CONFLICT_REASON_OPEN_LEASE = 1;
  CONFLICT_REASON_GENERATION_CHANGED = 2;
  CONFLICT_REASON_PATH_CHANGED = 3;
  CONFLICT_REASON_PATH_MISSING = 4;
}
message WorkspaceConflict {
  string path = 1;
  ConflictReason reason = 2;
  optional string detail = 3;
}
message RestoreWorkspace {
  string snapshot_id = 1;
  bool dry_run = 2;
  string scope = 3;
  omp.inference.v1.ValueMap props = 15;
}
message WorkspaceRestored {
  string snapshot_id = 1;
  string undo_snapshot_id = 2;
  repeated WorkspaceConflict conflicts = 3;
  bool partial = 4;
  omp.inference.v1.ValueMap props = 15;
}
message WorkspaceOp {
  oneof op {
    SnapshotWorkspace snapshot = 1;
    RestoreWorkspace restore = 2;
  }
  omp.inference.v1.ValueMap props = 15;
}
message WorkspaceResult {
  oneof result {
    WorkspaceSnapshot snapshot = 1;
    WorkspaceRestored restored = 2;
  }
  omp.inference.v1.ValueMap props = 15;
}

message CreateWorktree {
  string name = 1;
  optional string base = 2;
  repeated string paths = 3;
  omp.inference.v1.ValueMap props = 15;
}
message DestroyWorktree {
  string id = 1;
  bool force = 2;
  omp.inference.v1.ValueMap props = 15;
}
message MergeWorktree {
  string id = 1;
  string strategy = 2;
  bool dry_run = 3;
  omp.inference.v1.ValueMap props = 15;
}
message WorktreeInfo {
  string id = 1;
  string root_uri = 2;
  string base = 3;
  uint64 generation = 4;
  omp.inference.v1.ValueMap props = 15;
}
message WorktreeOp {
  oneof op {
    CreateWorktree create = 1;
    DestroyWorktree destroy = 2;
    MergeWorktree merge = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}
message WorktreeResult {
  WorktreeInfo worktree = 1;
  repeated WorkspaceConflict conflicts = 2;
  omp.inference.v1.ValueMap props = 15;
}

message SiteFile {
  string path = 1;
  bytes blob_hash = 2;
  uint32 mode = 3;
}
message MaterializeSite {
  string site_key = 1;
  repeated SiteFile files = 2;
  string idempotency_key = 3;
  uint64 host_generation = 4;
  uint64 session_generation = 5;
  omp.inference.v1.ValueMap props = 15;
}
message SiteMaterialized {
  string site_key = 1;
  string site_uri = 2;
  bytes manifest_hash = 3;
  uint64 unpacked = 4;
  omp.inference.v1.ValueMap props = 15;
}
message DetachExec {
  bytes exec = 1;
  string name = 2;
  omp.inference.v1.ValueMap props = 15;
}

message DataRequest {
  oneof body {
    DocumentOp document = 1;
    WalkRequest walk = 2;
