[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omp-stub"
version = "0.1.0"
description = "Typed standalone omp extension API with in-process fakes"
readme = {text = "Standalone typed API and test doubles for omp extensions.", content-type = "text/plain"}
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
authors = [{name = "OMP contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["omp"]
