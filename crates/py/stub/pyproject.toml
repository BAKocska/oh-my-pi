[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "omp-stub"
version = "0.1.0"
description = "Typed standalone omp extension API with in-process fakes"
readme = {text = "Standalone typed API and test doubles for omp extensions.", content-type = "text/plain"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stencil Labs, Inc." }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[dependency-groups]
build = ["hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["omp"]
